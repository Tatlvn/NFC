<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFC Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Ảnh nền đầu trang -->
    <div class="header">
      <img src="Image/header.png" alt="Header" />
    </div>

    <!-- Ảnh avatar -->
    <img src="Image/avatar.png" alt="Avatar" class="avatar" />

    <!-- Tiêu đề -->
    <h2>Welcome!</h2>

    <!-- Các nút liên kết -->
    <div class="button" id="facebook">
      <div class="overlay">
        <span class="text">Facebook</span>
      </div>
    </div>

    <div class="button" id="instagram">
      <div class="overlay">
        <span class="text">Instagram</span>
      </div>
    </div>

    <div class="button" id="credit">
      <div class="overlay">
        <span class="text">Credit card</span>
      </div>
    </div>
  </body>
</html>
